# CROSSFIT v13 Step 3 — IRED ESM-C adaptation and Gate 1.

dataset: IRED
paths:
  reports: Reports/step3
  checkpoints: Models/step3/IRED
  cache: Cache/step3/IRED
backbone:
  name: esmc_300m
  repository: biohub/ESMC-300M
  revision: e4bac860f0c502cd80f3aeac3d0ce6524c6627cb
  esm_package: 3.4.1.post1
adapter:
  scheduler_metric: validation_spearman
  rank: 16
  alpha: 32
  dropout: 0.05
  target: all_linear_layers
  freeze_embeddings: true
  head: linear
  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 16
  gradient_accumulation_steps: 2
  max_epochs: 80
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 4
  gradient_clip_norm: 1.0
  seed: 20261216
  shuffled_label_seed: 20261217
selection:
  cv_folds: 5
  cv_seed: 20261218
  metric: validation_spearman
extraction:
  dtype: float16
  full_dataset_batch_size: 8
  reserve_batch_size: 2
  store_all_layers_for_reserve_only: true
  store_selected_layer_for_full_dataset_only: true
gate1:
  task_gain_data: cross_validation
  task_gain_test: paired_two_sided_t
  task_gain_alpha: 0.05
  drift_data: layer_freeze_reserve
  separation_data: layer_freeze_reserve
  layer_selection_dataset: IRED
  real_cka_floor: 0.5
  exclude_first_layers: 3
  exclude_last_layers: 3
  near_maximum_drift_gap_fraction: 0.9
  drift_ratio_window: [0.5, 2.0]
  final_adapter_cv_fold: 0
  sensitivity_offsets: [-4, -2, 2, 4]
  bootstrap_samples: 2000
  bootstrap_seed: 20261219
  confidence_level: 0.95
task_gain_sweep:
  configurations:
    - {name: rank16_lr3e-4, rank: 16, learning_rate: 0.0003}
    - {name: rank32_lr1e-4, rank: 32, learning_rate: 0.0001}
    - {name: rank32_lr3e-4, rank: 32, learning_rate: 0.0003}
persistence:
  contract_version: 1
  write_cv_predictions: true
  save_cv_checkpoints: true
  save_sweep_checkpoints: true
  checkpoint_manifest: Reports/step3/checkpoint_manifest.json
budget:
  estimated_gpu_hours: 2.0
  session_hard_ceiling_gpu_hours: 9.0
  estimate_tolerance_fraction: 0.25
