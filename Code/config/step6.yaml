# CROSSFIT v17 Step 6 — IRED self-pair and matched-drift null calibration.
dataset: IRED
dimension: 960
width_multiplier: 1
decoder_bias: false
batch_topk:
  k: 32
  reasoning: "Published BatchTopK operating point; 3.3% of d, fixed before outcomes and across the width sweep."
training:
  seed: 20261301
  epochs: 20
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  delta_tolerance: 1.0e-7
calibration:
  fdr_q: 0.05
  exclude_dead_before_fit: true
  decoder_norm_floor_fraction: 0.1
  beta_fit_per_null_run: false
  pool_null_runs: true
  pooled_null_rule: concatenate_eligible_samples
  tails: [lower, upper]
  conservative_across_null_runs: false
  leave_one_seed_out: true
  shuffled_crosscoder_seeds: [20261311, 20261312, 20261313]
  resolution_audit:
    requested_total_null_seeds: 20
    total_null_seeds: 32
    seeds: [20261311, 20261312, 20261313, 20261314, 20261315, 20261316, 20261317, 20261318, 20261319, 20261320, 20261321, 20261322, 20261323, 20261324, 20261325, 20261326, 20261327, 20261328, 20261329, 20261330, 20261331, 20261332, 20261333, 20261334, 20261335, 20261336, 20261337, 20261338, 20261339, 20261340, 20261341, 20261342]
    width_multiplier: 1
    empirical_first_bh_cutoff: 5.208333333333333e-5
    tail_fraction: 0.05
    reasoning: "The registered dead/norm-floor filter leaves about 603 eligible features per null, so 20 runs cannot reach the first 960-test BH cutoff. Thirty-two total runs are the minimum expected to exceed 19,000 eligible null observations."
  latent_scaling_rule: both_ratios_must_pass
  latent_scaling_tail: lower
  latent_scaling_reasoning: "A candidate must pass both residual-error and reconstruction tests against the single pooled drift-matched null. Null-run leave-one-out variation is uncertainty, not an additional rejection rule."
  rotation_tail: lower
  activation_frequency_tail: two_sided_absolute
  drift_matched:
    enabled: true
    target_source: Reports/step3/gate1_report.json
    target_field: selected_real_relative_drift
    analysis_layer: 26
    maximum_epochs: 120
    matching_rule: closest_epoch_through_first_target_crossing
    optimizer_schedule: constant_registered_learning_rate
    concentration_bins: 5
    comfortable_norm_fraction: 1.0
    threshold_scope: [delta, latent_error, latent_reconstruction, decoder_cosine, activation_frequency_change]
    headline_rule: fewer_shifted_features
    shifted_classes: [emergent_candidate, evolution_only, rotated, re_weighted]
    reasoning: "v17 requires the shuffled-label adapter to match real activation drift unconditionally. Every threshold uses one pooled matched-drift null; adding null seeds improves estimation without silently tightening alpha."
paths:
  cache: Cache/step4/IRED
  step4_cache: Cache/step4/IRED
  checkpoint: Models/step6/IRED/self_pair_w1_seed20261301_nobias.pt
  report: Reports/step6/self_pair_null.json
  shuffled_cache: Cache/step6/IRED/shuffled
  shuffled_checkpoints: Models/step6/IRED/shuffled
  shuffled_adapter_checkpoint: Models/step3/IRED/shuffled_adapter.pt
  gate1_checkpoint_verification: Reports/step3/gate1_checkpoint_verification.json
  shuffled_cache_manifest: Reports/step6/shuffled_activation_cache_manifest.json
  calibration_report_dir: Reports/step6/calibration
  drift_matched_adapter_checkpoint: Models/step6/IRED/drift_matched_rotation/adapter.pt
  drift_matched_cache: Cache/step6/IRED/drift_matched_rotation
  drift_matched_crosscoder_checkpoints: Models/step6/IRED/drift_matched_rotation/crosscoders
  drift_matched_report_dir: Reports/step6/drift_matched_rotation
  v17_pooled_report_dir: Reports/step6/v17_pooled_null
  resolution_audit_report_dir: Reports/step6/v17_resolution_audit
