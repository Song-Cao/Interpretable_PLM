# CROSSFIT v10 Step 2 — independent direct-fitness pipelines.

datasets: [IRED, SPG1_STRSG_Olson_2014, GFP_AEQVI_Sarkisyan_2016, RASK_HUMAN_Weng_2022_abundance, OXDA_RHOTO_Vanella_2023_activity]

paths:
  georgiev_table: Code/config/georgiev_2009_standardized.csv
  ired_campaign: Data/processed/IRED_data/data_processed.csv
  ired_plate: Data/processed/IRED_data/plate_dataset.csv
  ired_variants: Data/processed/ired_variants.parquet
  ired_plate_curated: Data/processed/ired_plate.csv
  ired_pg_kfold: Data/processed/splits/ired_pg_kfold.csv
  ired_round_held_out: Data/processed/splits/ired_round_held_out.csv
  reports: Reports/step2
  models: Models/step2
  density_cache: Cache/step2/dpll

objective:
  margin_sd: 0.25
  temperature: 1.0
  magnitude_mode: huber
  huber_delta: 1.0
  residual_scale:
    initial: 1.0
    floor: 0.0001
  weights:
    rank: 1.0
    magnitude: 1.0
    censoring: 1.0
    regularization: 0.0001

ired_curation:
  dataset_id: IRED
  mutation_delimiter: "-"
  campaign_columns: {sequence: aa_seq, mutations: mut, fitness: fitness, round: start_round}
  plate_columns: [aa_seq, mut, "1/s"]
  pg_kfold_folds: 5
  primary_test_fold: 0
  split_seed: 20260827
  layer_freeze_fraction: 0.05
  layer_freeze_seed: 424242
  round_train: [1, 2, 3, 4]
  round_test: [5]

representations:
  vector: [onehot, aaindex_flat, esm_mean, esm_mutpool]
  sequence: [onehot_positional, esm_residue, esm_residue_delta]
  esm_mutpool_role: pooling_domain_diagnostic
  georgiev_channels: 19
  georgiev_sha256: ef8ba3e53df6ea0ac770cb86978fb68d679c28a1eff8b1ec3463e0fa17b161b4

architectures:
  vector: [ridge, mlp, random_forest, gradient_boosted_trees]
  sequence: [conv_residual, attention_pooling]
  ridge:
    site_penalty: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    density_penalty: 1.0e-8
  mlp:
    hidden_dims: [[256, 128], [512, 256], [512, 256, 128]]
    dropout: [0.1, 0.25, 0.4]
  random_forest:
    n_estimators: [300, 600]
    max_depth: [null, 12, 24]
    min_samples_leaf: [1, 2, 5]
    max_features: [sqrt, 0.5, 1.0]
  gradient_boosted_trees:
    n_estimators: [100, 300, 600]
    learning_rate: [0.01, 0.05, 0.1]
    max_depth: [2, 3, 5]
    min_samples_leaf: [1, 2, 5]
    subsample: [0.7, 1.0]
  conv_residual:
    width: [128, 256]
    depth: [3, 5]
    kernel_size: [3, 5, 7]
    dropout: [0.1, 0.25]
  attention_pooling:
    attention_dim: [64, 128]
    hidden_dim: [128, 256]
    dropout: [0.1, 0.25]

optimization:
  ensemble_seeds: [0, 1, 2, 3, 4]
  validation_fraction: 0.15
  validation_seed: 20261021
  batch_size: [32, 64, 128]
  learning_rate: [0.0001, 0.0003, 0.001]
  weight_decay: [0.0001, 0.001, 0.01]
  max_epochs: 300
  early_stopping_patience: 25
  early_stopping_min_delta: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 8
  gradient_clip_norm: 1.0

evaluation:
  selection_metric: pg_kfold_test_spearman
  top_k: [24, 48, 96]
  conformal_alpha: 0.1
  ensemble_members: 5
  report: [spearman, pearson, mse, top_k_precision, test_hit_rate, ndcg, mondrian_coverage]
  plate_report: [spearman, ndcg]
