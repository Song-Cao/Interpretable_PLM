# CROSSFIT v16 Step 7 — IRED taxonomy and effective-rank width diagnostics.
dataset: IRED
dimension: 960
width_multipliers: [1, 2, 4, 8]
decoder_bias: false
batch_topk:
  k: 32
  reasoning: "Published BatchTopK operating point; 3.3% of d, fixed before outcomes so width alone changes."
training:
  seeds: [20261311, 20261312, 20261313]
  epochs: 20
  batch_size: 1024
  evaluation_batch_size: 2048
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 1.0
diagnostics:
  pca_variance_thresholds: [0.5, 0.8, 0.9, 0.95, 0.99]
  raw_pca_batch_size: 4096
  death_timing_rerun_all_registered_seeds: true
  dead_feature_resampling:
    width_multiplier: 4
    seed: 20261311
    resampling_rng_seed: 20261404
    epochs: [5, 10, 15]
    minimum_absolute_dead_fraction_reduction: 0.10
    require_no_worse_than_baseline_w2_mean: true
  default_working_widths: [1, 2]
  selected_working_widths: [1, 2]
  adapter_rank:
    layer: 26
    batch_size: 4096
    reserve_base: Cache/step2/IRED/representations/reserve_all_layers_base.npy
    reserve_real: Cache/step3/IRED/reserve_all_layers_adapted.npy
    reserve_shuffled: Cache/step3/IRED/reserve_all_layers_shuffled.npy
taxonomy:
  fdr_q: 0.05
  decoder_norm_floor_fraction: 0.1
  activation_floor_count: 1
  classification_precedence:
    [dead, emergent_candidate, evolution_only, rotated, re_weighted, conserved]
  emergent_candidate_requires: [upper_delta_tail, error_ratio, reconstruction_ratio]
  final_emergent_requires_causal_validation: true
  provisional_until_step8: true
paths:
  cache: Cache/step4/IRED
  checkpoints: Models/step7/IRED
  report_dir: Reports/step7
  diagnostic_checkpoints: Models/step7/IRED/diagnostics
